# Goal: Push the scanned image to DockerHUb / ECR / GCR / GHCR / ACR
# Goal: To build and push the docker images

name: docker push

on:

   workflow_call:

#this workflow will build and push the docker image to dockerhub
jobs:
    docker-build-and-push:
      runs-on: ubuntu-latest

      steps:
       - name: code checkout
         uses: actions/checkout@v7

       - name: setup docker
         uses: docker/setup-docker-action@v5

       - name: docker login
         uses: docker/login-action@v3
         with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

       - name: set up Buildx
         uses: docker/setup-buildx-action@v4

       - name: docker push
         uses: docker/build-push-action@v7  
         with:
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/e-commerce-python:latest
            load: true