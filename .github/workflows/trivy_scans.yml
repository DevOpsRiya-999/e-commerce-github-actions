#Goal: scan the code after the docker image is built and pushed to the docker hub for any vulnerabilities in the dependencies used in the code

name: image-scan
on: 
  workflow_call:

jobs:
    trivy-scan:
        runs-on: ununtu-latest
        steps:
          - name: checkout code
            uses: actions/checkout@v7

          - name: setup docker
            uses: docker/setup-docker-action@v5

          - name: docker login
            uses: docker/login-action@v3
            with:
             username: ${{ vars.DOCKERHUB_USERNAME }}
             password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: set up Buildx
            uses: docker/setup-buildx-action@v4

          - name: build the docker image
            uses: docker/build-push-action@v7  
            with:
             push: false
             tags: ${{ vars.DOCKERHUB_USERNAME }}/e-commerce-python:latest

          - name: Trivy Scan
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              image-ref: ${{ vars.DOCKERHUB_USERNAME }}/e-commerce-python:latest
              format: 'table'
              exit-code: '1'
              ignore-unfixed: true
          
              vuln-type: 'os,library'
              severity: 'CRITICAL,HIGH'   

  
