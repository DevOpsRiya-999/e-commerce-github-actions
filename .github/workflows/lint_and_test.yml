# Goal: To check if the python code is syntactically correct

name: lint code

on:

   workflow_call:


jobs:
     code-linter-and-tester:
        strategy:
          matrix:
            python-version: ['3.12','3.13','3.14']

        runs-on: ubuntu-latest
        steps:
           - name: code checkout
             uses: actions/checkout@v7

           - name: setup python
             uses: actions/setup-python@v4
             with:
                python-version: ${{ matrix.python-version }}

           - name: install dependencies
             run: pip install -r requirements.txt     

           - name: code lint
             run: ruff check .

           - name: code test
             run: pytest
